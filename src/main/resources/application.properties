
spring.application.name=careertrack-api

server.port=${PORT:8080}
server.forward-headers-strategy=framework

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/careertrack}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER:careertrack-api}
app.jwt.token-lifetime-seconds=${JWT_TOKEN_LIFETIME_SECONDS:900}
